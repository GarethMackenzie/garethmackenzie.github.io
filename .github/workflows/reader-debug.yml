name: Reader visual diagnosis
on:
  pull_request:
    paths: ['tools/reader_debug.mjs', '.github/workflows/reader-debug.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/site.log 2>&1 &
          node tools/reader_debug.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reader-diagnosis
          path: qa-reports/reader-debug

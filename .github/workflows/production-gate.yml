name: Production Gate

on:
  workflow_run:
    workflows: ["Site QA"]
    types: [completed]

concurrency:
  group: github-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy verified revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA-passed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify revision is still current main
        id: current
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --depth=1
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "QA-passed revision is current main: $EXPECTED_SHA"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale QA-passed revision $EXPECTED_SHA; current main is $current_sha"
          fi

      - name: Configure GitHub Pages
        if: steps.current.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage production-only website
        if: steps.current.outputs.current == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          runtime_files=(
            index.html
            404.html
            analytics.js
            script.js
            premium-home.js
            robots.txt
            sitemap.xml
            insight-article.css
            insights-publishing.css
            google5b43e442e1b6a4c0.html
          )

          runtime_dirs=(
            about
            assets
            built
            contact
            dist
            insights
            media
            privacy
            terms
          )

          for file in "${runtime_files[@]}"; do
            test -f "$file"
            cp "$file" _site/
          done

          for dir in "${runtime_dirs[@]}"; do
            test -d "$dir"
            cp -R "$dir" _site/
          done

          # Deployment hygiene: repository internals and source-only files must never ship.
          test ! -e _site/tools
          test ! -e _site/.github
          test ! -e _site/README.md
          test ! -e _site/MIGRATION-NOTES.md
          test ! -e _site/styles.css
          test ! -e _site/theme.css
          test ! -e _site/pages.css

          echo "Production artifact contains $(find _site -type f | wc -l | tr -d ' ') files."

      - name: Upload verified Pages artifact
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

      - name: Deploy verified revision
        if: steps.current.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Generate social cards

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/generate_social_cards.py'
      - '.github/workflows/generate-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Update social cards
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate cards and update metadata
        run: python tools/generate_social_cards.py

      - name: Commit generated publishing assets to change branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social/*.png insights/index.html insights/*/index.html
          if git diff --cached --quiet; then
            echo 'No generated publishing changes to commit.'
            exit 0
          fi
          git commit -m 'Wire branded social cards into Insights'
          git push origin "HEAD:${TARGET_BRANCH}"

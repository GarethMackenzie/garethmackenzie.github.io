name: Generate social cards

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_social_cards.py'
      - '.github/workflows/generate-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate cards and update metadata
        run: python tools/generate_social_cards.py
      - name: Commit generated publishing assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/social/*.png insights/index.html insights/*/index.html
          if git diff --cached --quiet; then
            echo 'No generated publishing changes to commit.'
            exit 0
          fi
          git commit -m 'Wire branded social cards into Insights'
          git push

name: Final site hardening

on:
  push:
    branches: [main]
    paths:
      - 'tools/final_hardening.py'
      - '.github/workflows/final-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply hardening
        run: python tools/final_hardening.py

      - name: Validate changes
        run: git diff --check

      - name: Commit hardening updates
        run: |
          if git diff --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy/index.html terms/index.html contact/index.html media/index.html insights/*/index.html
          git commit -m "Apply final website hardening"
          git push

name: Apply technical SEO

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply_technical_seo.py'
      - '.github/workflows/apply-technical-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    name: Update technical SEO
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply technical SEO standardization
        run: python tools/apply_technical_seo.py

      - name: Validate generated changes
        run: git diff --check

      - name: Commit SEO updates to change branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html built/index.html about/index.html media/index.html contact/index.html privacy/index.html terms/index.html insights/index.html insights/*/index.html
          git commit -m "Standardize technical SEO metadata"
          git push origin "HEAD:${TARGET_BRANCH}"

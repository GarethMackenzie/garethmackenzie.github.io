name: Apply technical SEO

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_technical_seo.py'
      - '.github/workflows/apply-technical-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply technical SEO standardization
        run: python tools/apply_technical_seo.py

      - name: Validate generated changes
        run: git diff --check

      - name: Commit SEO updates
        run: |
          if git diff --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html built/index.html about/index.html media/index.html contact/index.html privacy/index.html terms/index.html insights/index.html insights/*/index.html
          git commit -m "Standardize technical SEO metadata"
          git push

name: Build performance assets

on:
  pull_request:
    branches: [main]
    paths:
      - 'styles.css'
      - 'cover.css'
      - 'theme.css'
      - 'premium-home.css'
      - 'site-tuning.css'
      - 'pass1-stability.css'
      - 'home-editorial.css'
      - 'performance-tuning.css'
      - 'premium-pages.css'
      - 'premium-overrides.css'
      - 'pages.css'
      - 'assets/book-cover.jpg'
      - 'tools/build_performance_assets.py'
      - '.github/workflows/build-performance-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Update performance assets
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout change branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build CSS bundles and responsive images
        run: python tools/build_performance_assets.py

      - name: Validate generated changes
        run: git diff --check

      - name: Commit performance assets to change branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html built/index.html '**/index.html' assets/book-cover-480.webp assets/book-cover-640.webp assets/book-cover-800.webp assets/book-cover-1200.webp
          git commit -m "Build optimized site assets"
          git push origin "HEAD:${TARGET_BRANCH}"

name: Artifact check (temporary, not part of the release)
on:
  push:
    branches: [ci-artifact-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stage the production artifact exactly as the gate does and verify it
        run: python3 tools/verify_artifact.py _site --stage
      - name: Show the staged tree
        run: |
          find _site -type f | sed 's|/[^/]*$||' | sort | uniq -c | sort -rn | head -20
